[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-camera-capture"
version = "0.1.0"
description = "Loss-aware raw scientific camera acquisition with a hardware-free simulator"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]
dependencies = []

[project.optional-dependencies]
export = ["numpy>=1.24", "tifffile>=2023.7.10"]
aravis = ["PyGObject>=3.42"]
dev = ["pytest>=7", "ruff>=0.8", "mypy>=1.10", "build>=1", "numpy>=1.24", "tifffile>=2023.7.10"]

[project.scripts]
scicam = "scientific_camera.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["hardware: requires explicit --run-hardware and an attached GenICam camera"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true

